# -----------------------------------------------------------------------------
# Pylint Configuration
# -----------------------------------------------------------------------------
[tool.pylint.main]
# Fail the build if the total score drops below this number
fail-under = 8.5

# Files or directories to ignore during linting (e.g., virtual environments)
ignore = [".venv", "venv", "env", "build", "dist"]

[tool.pytest.ini_options]
cache_dir = "/tmp/.pytest_cache"
addopts = "--alluredir=allure-results"