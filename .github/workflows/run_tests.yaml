name: RunTests

on:
  workflow_dispatch:

permissions:
  pull-requests: write
  checks: write

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15' # Change to your project's Python version
          cache: 'pip'           # Caches pip packages to speed up future runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        env:
          WANIKANI_TOKEN: ${{ secrets.WANIKANI_TOKEN }}
        run: |
          python -m pytest .

      - name: Run Allure
        run: npx allure --version

      - name: Generate Allure Report
        if: always()
        run: npx allure generate pytest-cache-files

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: reports