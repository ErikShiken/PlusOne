name: RunTests

on:
  workflow_dispatch:

permissions:
  pull-requests: write
  checks: write

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15' # Change to your project's Python version
          cache: 'pip'           # Caches pip packages to speed up future runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node
        uses: actions/setup-node@5
        with:
          node-version: 'package.json'
          cache: 'npm'

      - name: Install Allure CI
        run: |
          npm install -g allure 

      - name: Run Tests
        run: |
          python -m pytest .