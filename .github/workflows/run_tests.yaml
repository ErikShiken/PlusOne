name: RunTests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  pull-requests: write
  checks: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Tests
        env:
          WANIKANI_TOKEN: ${{ secrets.WANIKANI_TOKEN }}
        run: |
          python -m pytest .

      - name: Fetch Previous History
        if: always()
        run: curl -fsSL https://erikshiken.github.io/PlusOne/history.jsonl -o history.jsonl || echo "No previous history yet"

      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results

      - name: Add History to Report
        if: always()
        run: cp history.jsonl allure-report/

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report

      - name: Set up Pages
        if: always()
        uses: actions/configure-pages@v6

      - name: Upload Pages Content
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v5